<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatty – Chatbot for Simple Questions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat" aria-label="Chatbot">
    <header class="chat__head">
      <div class="avatar" aria-hidden="true">C</div>
      <div class="chat__title">
        <h1>Chatty</h1>
        <p>Ask me a simple question</p>
      </div>
      <button id="clear" class="ghost" type="button">Clear chat</button>
    </header>

    <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation"></div>

    <div id="chips" class="chips" aria-label="Suggested questions"></div>

    <form id="form" class="composer" autocomplete="off">
      <label for="input" class="sr">Type your question</label>
      <input id="input" type="text" placeholder="Type a question, e.g. what time is it?" maxlength="200" required>
      <button type="submit">Send</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
